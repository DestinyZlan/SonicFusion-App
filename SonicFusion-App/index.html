<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicFusion App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🎵 SonicFusion</h1>
            <p class="subtitle">Next-Gen Audio Experience</p>
        </header>

        <main class="player-card">
            <div class="album-art">
                <div class="pulse-ring"></div>
                <span class="icon">🎧</span>
            </div>
            
            <div class="track-info">
                <h2 id="track-name">Loading...</h2>
                <p id="artist-name">SonicFusion AI</p>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>

            <div class="controls">
                <button class="btn-control" id="prev-btn">⏮</button>
                <button class="btn-play" id="play-btn">▶</button>
                <button class="btn-control" id="next-btn">⏭</button>
            </div>
        </main>

        <footer class="app-footer">
            <p>&copy; 2026 SonicFusion Team. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
